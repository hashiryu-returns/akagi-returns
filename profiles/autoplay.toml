# Timing values shared by every profile. `apply-profile.sh` patches these keys
# into Akagi's config.toml in place and touches nothing else — start_url, the
# overlay, bot selection and the CA settings stay as you left them.
#
# ---------------------------------------------------------------------------
# The four click-mechanics values
# ---------------------------------------------------------------------------
# Only min_delay_ms does anything the server can see.
#
# hover_delay_ms and inter_click_delay_ms are part of click_overhead_ms, which
# Akagi subtracts from the sleep before clicking (majsoul/mod.rs). Moving them
# shifts time between the sleep and the hover without changing when the click
# lands, so they cannot change `timeuse` at all. min_button_delay_ms is a floor
# for button UI readiness. All three are at Akagi's defaults; they were once set
# to odd numbers on the theory that round values made Akagi users identifiable,
# which measurement disproved — `timeuse` on the wire is whole seconds, 7,499
# uplink actions with not one fractional value.
#
# min_delay_ms is the exception, because it is a floor on the *sleep* while
# `timeuse` measures through to the click. The observed minimum is therefore
# min_delay_ms + click_overhead (~300 ms: 200 hover, 100 hold) + ~38 ms of
# latency. At Akagi's 1000 that is ~1.34 s, so every decision the model wants
# to make in under a second still arrives as `timeuse: 1` and the zero-second
# bucket stays empty — an 8.9 point gap against real opponents, who put 9-11%
# of their discards there.
#
# 600 was set to put the observed floor near 938 ms, inside that bucket. The
# floor landed where predicted — 946 ms measured, and 11.9% of discards came in
# under a second on our clock — but the bucket did not follow: only 2.0%
# arrived as `timeuse: 0`. The client's clock leads ours by a fitted 390 ms with
# a 290 ms standard deviation, so most sub-second clicks are reported as a 1 and
# the boundary is crossed probabilistically rather than at a threshold.
#
# But the human 10% it was being compared against is NOT a timeuse. Opponent
# frames carry no timing field, so their think time is measured as a wall clock
# on our side of the proxy -- the other of the two clocks. The deficit was mostly the offset.
#
# Measured properly, per decision type, against the opponents at our own tables:
# the floor governs the fast tail, which is almost all tsumogiri. At 600 our
# tsumogiri came in under a second 17.9% of the time against their 13.9%; at
# 250 that rose to 24.6% against 14.5%. The floor was already slightly over the
# human rate and going lower doubled the overshoot, so 600 it is.
#
# Nothing below 946 ms is needed and the render margin is worth keeping. 250 was
# harmless mechanically -- 176 discards, one retry, no losses -- just wrong.
# See majsoul-wire-timing docs/03-fitting-a-delay-model.md.
#
# ---------------------------------------------------------------------------
# The dealer-opening pad and the bank ceiling
# ---------------------------------------------------------------------------
# dealer_first_discard_extra_delay_ms exists for a mechanical reason: Mahjong
# Soul plays a hand-sort animation when the dealer receives fourteen tiles at
# once, and a click during it is dropped. It is only a floor on the Lua path.
#
# It was briefly lowered to 2000 on the theory that 3000 was standing in for
# think time the model was not producing. That diagnosis was wrong: the
# collapse into one whole-second bucket came from the budget cap, not from the
# pad, and unlocking the bank for the opening fixed it on its own. Meanwhile
# 2000 broke the pad's actual job. Measured over 127 of our own dealer
# openings, the animation swallows every press landing before ~2.9 s: 10 of 10
# openings that pressed in the 2.5 s bucket were lost outright, 0 of 44 past
# 4.0 s were, and 45% of the openings that did succeed needed a retry. A lost
# opening is not a lost discard — the turn runs to timeout and the client
# tsumogiri's a tile of its own choosing with timeuse stamped at the maximum.
# Back at 3000 the first press lands at ~3.3 s. The fingerprint cost is
# negligible: L1 against measured human openings is 18.6 at a 2000 floor and
# 18.9 at 3000, same median, same modal bucket, because the model's own draw
# is above the floor on 95% of openings. Do not lower it again.
# See majsoul-wire-timing docs/04-click-reliability.md.
#
# bank_use_fraction and bank_max_single_ms cap how much of the server's extra
# time pool one decision may spend. The pool is 20 s and refills every kyoku.
# At 0.25 / 5000 the ceiling on a long thought was 8.67 s, which truncated both
# the dealer opening (measured humans: 15% at nine seconds or longer) and the
# ordinary long-thought tail (measured 2.2% at nine or longer, ours 0%). At
# 0.45 / 8000 the ceiling is 11.67 s. Normal discards barely move — median
# 1.97 → 1.99 s, sub-second share 12.0 → 12.1% — while the nine-second tail
# recovers from 0 to 1.3%. Akagi recomputes the ceiling from the *remaining*
# pool on every decision, so two long thoughts in one kyoku self-limit.
# See majsoul-wire-timing docs/03-fitting-a-delay-model.md.

[autoplay.majsoul]
inter_click_delay_ms = 300   # Akagi default; compensated, cannot affect timeuse
hover_delay_ms = 200         # Akagi default; compensated, cannot affect timeuse
dealer_first_discard_extra_delay_ms = 3000   # animation cover; measured ~2.9s

[autoplay.delay]
min_delay_ms = 600           # tsumogiri snap rate matches the humans here
min_button_delay_ms = 1600   # Akagi default; button UI readiness only
bank_use_fraction = 0.45     # raised from 0.25 to reach the 9 s+ tail
bank_max_single_ms = 8000    # raised from 5000; ceiling becomes 11.67 s
